<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#173e36" />
    <meta
      name="description"
      content="ShiftLog — your hours, earnings, and savings in one place."
    />
    <title>ShiftLog · Work toward more</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/vendor/moment.js" defer></script>
    <script src="/vendor/moment-timezone.js" defer></script>
    <script src="/vendor/chart.js" defer></script>
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>
    <aside class="sidebar">
      <a class="brand" href="#dashboard"
        ><span class="brand-mark">s<span>l</span></span
        >ShiftLog<span class="brand-dot">.</span></a
      >
      <p class="nav-label">YOUR WORKSPACE</p>
      <nav aria-label="Main navigation" id="navigation"></nav>
      <div class="sidebar-bottom">
        <div class="workspace-avatar">SL</div>
        <div>
          <strong>Personal workspace</strong><small>Vancouver, BC · CAD</small>
        </div>
        <span class="online-dot"></span>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb">
          Workspace <span>/</span> <strong id="breadcrumb">Overview</strong>
        </div>
        <div class="topbar-right">
          <span class="timezone-label">America/Vancouver</span
          ><span class="avatar">SL</span>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <div class="loading-state">
          <span class="spinner"></span>Loading your workspace…
        </div>
      </main>
      <footer>
        Built for a clearer picture of your work.<span
          >All amounts in CAD · Gross pay estimates</span
        >
      </footer>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="modal" aria-labelledby="modal-title">
      <div id="modal-content"></div>
    </dialog>
  </body>
</html>
